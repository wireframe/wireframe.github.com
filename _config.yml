# Site configuration
title: "[codecrate]"
description: Building stuff that matters
# customize the post url to include date + title to mirror existing blogger urls
# example /2009-04-29-slap-chop.textile
permalink: /:year/:month/:title.html
search: true
# The url is only used when full-domain names are needed
# such as sitemap and atom
# Most places will/should use BASE_PATH to make the urls
url: https://codecrate.com
locale: en_US
image:
  feature: background.jpg
  # Fallback for link previews on posts with no image of their own.
  # 1200x630 is the size LinkedIn and X crop against.
  default: og-default.png

# Site owner/author info
owner:
  name: Ryan Sonnek
  avatar: avatar.jpg
  email: ryan@codecrate.com
  twitter: codecrate
  github: wireframe
  linkedin: ryansonnek
  comment-address: comments@codecrate.com
  google:
    analytics: 'UA-1922195-6'

# Jekyll Configuration
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
markdown: kramdown
exclude:
  - bin
  - README.md
  - CNAME
  - params.json
gems:
  - jekyll-sitemap

